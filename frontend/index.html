    <script type="module">
        import {
            HandLandmarker,

        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

        // --------------------------------------------------------------------------
        // CONFIGURATION & TUNED CONSTANTS
        // --------------------------------------------------------------------------
        const CONFIG = {
            minHandConfidence: 0.50,
            minPalmNorm: 0.03,           // Minimum distance (Hand too far)
            maxPalmNorm: 0.55,           // Maximum distance (Hand too close)
            pinchThresholdScale: 0.38,   // Dynamic pinch threshold = palmSize * 0.38
            pinchReleaseMultiplier: 1.3, // Release threshold = engage * 1.3
            pinchConsecutiveFrames: 2,   // Consecutive frames to start pinch
            
            // Screen Deadzone Margins (compensated for 16:9 vs 4:3 aspect ratio)
            deadzoneMarginX: 0.12,       // Extra horizontal margin for easy corner reach
            deadzoneMarginY: 0.08,       // Vertical margin
            
            // One Euro Filter Parameters (Zero jitter when still, instant response when fast)
            oneEuroMinCutoff: 1.2,       // Low-speed cutoff (Hz) -> ultra stable cursor
            oneEuroBeta: 0.045,          // Velocity coefficient -> zero latency on fast motion
            oneEuroDCutoff: 1.0,         // Derivative cutoff
            
            // Click Timing & Interaction
            clickHoldThresholdMs: 300,   // Max tap duration (ms). Holds > 300ms produce no click on release.
            fistHoldMs: 150,             // Continuous hold time before fist becomes drag
            scrollSpeedMultiplier: 80,   // Velocity scale for 2-finger scrolling
            scrollDeltaThreshold: 0.007, // Minimum vertical movement for scroll trigger
        };

        // --------------------------------------------------------------------------
        // AUDIO SYNTHESIZER (Haptic-style audio feedback on clicks)
        // --------------------------------------------------------------------------
        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playClick(freq = 800) {
                try {
                    if (!this.ctx || this.ctx.state === 'suspended') return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.03);

                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.03);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.03);
                } catch (e) {
                    // Audio autoplay policy fallback
                }
            }
        }
        const sfx = new SoundFX();

        // --------------------------------------------------------------------------
        // ONE EURO FILTER IMPLEMENTATION (Casiez et al. 2012)
        // --------------------------------------------------------------------------
        class OneEuroFilter {
            constructor(minCutoff = 1.0, beta = 0.0, dCutoff = 1.0) {
                this.minCutoff = minCutoff;
                this.beta = beta;
                this.dCutoff = dCutoff;
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }

            alpha(cutoff, dt) {
                const tau = 1.0 / (2 * Math.PI * cutoff);
                return 1.0 / (1.0 + tau / dt);
            }

            filter(x, timestamp) {
                if (this.tPrev === null) {
                    this.xPrev = x;
                    this.dxPrev = 0;
                    this.tPrev = timestamp;
                    return x;
                }

                const dt = Math.max((timestamp - this.tPrev) / 1000.0, 0.001);
                this.tPrev = timestamp;

                const dx = (x - this.xPrev) / dt;
                const alphaD = this.alpha(this.dCutoff, dt);
                const dxHat = alphaD * dx + (1 - alphaD) * this.dxPrev;
                this.dxPrev = dxHat;

                const cutoff = this.minCutoff + this.beta * Math.abs(dxHat);
                const alphaHat = this.alpha(cutoff, dt);
                const xHat = alphaHat * x + (1 - alphaHat) * this.xPrev;
                this.xPrev = xHat;

                return xHat;
            }

            reset() {
                this.xPrev = null;
                this.dxPrev = 0;
                this.tPrev = null;
            }
        }

        // --------------------------------------------------------------------------
        // GLOBAL PIPELINE STATE
        // --------------------------------------------------------------------------
        const state = {
            handLandmarker: null,
            video: document.getElementById("webcam-video"),
            canvas: document.getElementById("output-canvas"),
            ctx: document.getElementById("output-canvas").getContext("2d"),
            cursorEl: document.getElementById("cursor"),
            statusText: document.getElementById("status-text"),

            // 1€ Filter instances for X and Y coordinates
            filterX: new OneEuroFilter(CONFIG.oneEuroMinCutoff, CONFIG.oneEuroBeta, CONFIG.oneEuroDCutoff),
            filterY: new OneEuroFilter(CONFIG.oneEuroMinCutoff, CONFIG.oneEuroBeta, CONFIG.oneEuroDCutoff),

            // Pinch Stability & Coordinate Anchor
            isPinchingLeft: false,
            isPinchingRight: false,
            pinchStartTime: 0,
            pinchAnchorCoords: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
            pinchConsecutiveCount: 0,
            fistStartTime: 0,

            // Smooth Tracking Coordinates
            smoothedCoords: { x: window.innerWidth / 2, y: window.innerHeight / 2 },

            // Grace period buffer (absorbs 3 dropped frames)
            gracePeriodFrames: 0,
            lastValidLandmarks: null,
            lastValidSmoothedCoords: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
            lastValidGesture: null,

            // Scroll velocity baseline
            prevScrollMidpointY: null,

            // Active debounced gesture
            activeGesture: { type: 'move', button: null, direction: null, label: 'Gesture: Moving' }
        };

        // --------------------------------------------------------------------------
        // 1. INITIALIZE MEDIAPIPE HAND LANDMARKER
        // --------------------------------------------------------------------------
        async function initMediaPipe() {
            try {
                state.statusText.textContent = "Loading MediaPipe...";

                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );

                try {
                    state.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                            delegate: "GPU"
                        },
                        runningMode: "VIDEO",
                        numHands: 1,
                        minHandDetectionConfidence: 0.5,
                        minHandPresenceConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });
                } catch (gpuErr) {
                    console.warn("GPU failed, fallback to CPU:", gpuErr);
                    state.handLandmarker = await HandLandmarker.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
                        },
                        runningMode: "VIDEO",
                        numHands: 1,
                        minHandDetectionConfidence: 0.5,
                        minHandPresenceConfidence: 0.5,
                        minTrackingConfidence: 0.5
                    });
                }

                state.statusText.textContent = "Starting Camera...";
                startWebcam();
            } catch (err) {
                console.error("Initialization error:", err);
                state.statusText.textContent = "MediaPipe Load Error";
            }
        }

        // --------------------------------------------------------------------------
        // 2. START WEBCAM STREAM
        // --------------------------------------------------------------------------
        async function startWebcam() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                state.statusText.textContent = "Camera Not Supported (use Chrome/HTTPS)";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                });

                state.video.srcObject = stream;

                state.video.addEventListener("loadeddata", () => {
                    state.canvas.width = state.video.videoWidth || 640;
                    state.canvas.height = state.video.videoHeight || 480;

                    state.statusText.textContent = "Ready - Show Hand";
                    window.requestAnimationFrame(predictLoop);
                });

                await state.video.play();
            } catch (err) {
                console.error("Webcam access error:", err);
                state.statusText.textContent = "Camera Access Denied";
            }
        }

        // --------------------------------------------------------------------------
        // 3. MATHEMATICAL HELPERS & SCREEN MAPPING
        // --------------------------------------------------------------------------
        function calculateDistance(lm1, lm2, width = 1, height = 1) {
            const dx = (lm1.x - lm2.x) * width;
            const dy = (lm1.y - lm2.y) * height;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        /**
         * Maps camera landmarks to viewport pixels with separate X & Y margins
         * to handle 16:9 screen vs 4:3 camera aspect ratios naturally.
         */
        function mapLandmarkToScreen(normX, normY) {
            const mirroredX = 1 - normX;
            const marginX = CONFIG.deadzoneMarginX;
            const marginY = CONFIG.deadzoneMarginY;

            const mappedNormX = clamp((mirroredX - marginX) / (1 - 2 * marginX), 0, 1);
            const mappedNormY = clamp((normY - marginY) / (1 - 2 * marginY), 0, 1);

            return {
                x: mappedNormX * window.innerWidth,
                y: mappedNormY * window.innerHeight
            };
        }

        // --------------------------------------------------------------------------
        // 4. HAND & DISTANCE VALIDATION
        // --------------------------------------------------------------------------
        function validateHandAndDistance(results) {
            if (!results.landmarks || results.landmarks.length === 0 || results.landmarks[0].length !== 21) {
                return { isValid: false, reason: "NO_HAND", label: "No Hand Detected" };
            }

            const lm = results.landmarks[0];
            const wrist = lm[0];
            const indexMcp = lm[5];
            const middleTip = lm[12];
            const pinkyMcp = lm[17];
            const middleMcp = lm[9];

            // 1. Handedness confidence
            if (results.handedness && results.handedness.length > 0 && results.handedness[0].length > 0) {
                const handednessScore = results.handedness[0][0].score || 1.0;
                if (handednessScore < CONFIG.minHandConfidence) {
                    return { isValid: false, reason: "LOW_CONFIDENCE", label: "No Hand Detected" };
                }
            }

            // 2. Hand distance / size validation
            const palmLengthNorm = calculateDistance(wrist, middleMcp);
            if (palmLengthNorm < CONFIG.minPalmNorm) {
                return { isValid: false, isWarn: true, landmarks: lm, label: "Move Hand Closer" };
            }
            if (palmLengthNorm > CONFIG.maxPalmNorm) {
                return { isValid: false, isWarn: true, landmarks: lm, label: "Move Hand Back" };
            }

            // 3. Shape ratio check (Foot vs Hand rejection)
            const handWidth = calculateDistance(indexMcp, pinkyMcp);
            const handLength = calculateDistance(wrist, middleTip);
            const shapeRatio = handLength / (handWidth || 0.0001);

            if (shapeRatio < 0.3 || shapeRatio > 5.0) {
                return { isValid: false, reason: "NON_HAND_RATIO", label: "No Hand Detected" };
            }

            return {
                isValid: true,
                landmarks: lm,
                palmLengthNorm: palmLengthNorm
            };
        }

        // --------------------------------------------------------------------------
        // 5. GESTURE CLASSIFIER & PINCH / FIST DISAMBIGUATION
        // --------------------------------------------------------------------------
        function classifyGestureRaw(lm, canvasW, canvasH) {
            const wrist = lm[0];
            const thumbTip = lm[4];
            const indexTip = lm[8];
            const indexPip = lm[6];
            const middleTip = lm[12];
            const middlePip = lm[10];
            const middleMcp = lm[9];
            const ringTip = lm[16];
            const ringPip = lm[14];
            const pinkyTip = lm[20];
            const pinkyPip = lm[18];

            // Dynamic pinch threshold based on palm size
            const handSizePx = calculateDistance(wrist, middleMcp, canvasW, canvasH);
            const dynamicPinchThreshold = Math.max(28, handSizePx * CONFIG.pinchThresholdScale);

            const isCurrentlyPinching = state.isPinchingLeft || state.isPinchingRight;
            const currentThreshold = isCurrentlyPinching
                ? dynamicPinchThreshold * CONFIG.pinchReleaseMultiplier
                : dynamicPinchThreshold;

            const distThumbIndex = calculateDistance(thumbTip, indexTip, canvasW, canvasH);
            const distThumbMiddle = calculateDistance(thumbTip, middleTip, canvasW, canvasH);

            // Finger extension calculations (1.15 multiplier)
            const isIndexExtended = calculateDistance(indexTip, wrist, canvasW, canvasH) > calculateDistance(indexPip, wrist, canvasW, canvasH) * 1.15;
            const isMiddleExtended = calculateDistance(middleTip, wrist, canvasW, canvasH) > calculateDistance(middlePip, wrist, canvasW, canvasH) * 1.15;
            const isRingExtended = calculateDistance(ringTip, wrist, canvasW, canvasH) > calculateDistance(ringPip, wrist, canvasW, canvasH) * 1.15;
            const isPinkyExtended = calculateDistance(pinkyTip, wrist, canvasW, canvasH) > calculateDistance(pinkyPip, wrist, canvasW, canvasH) * 1.15;

            // Tight fist check: all 4 fingers deeply curled toward wrist
            const isAllFingersCurled = (!isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended);

            // 1. Disambiguated Pinch Detection (Checked FIRST so fist never preempts frame 1 of a pinch)
            const isThumbIndexPinchCandidate = distThumbIndex < currentThreshold;
            const isThumbMiddlePinchCandidate = distThumbMiddle < currentThreshold;

            if (isThumbMiddlePinchCandidate || isThumbIndexPinchCandidate) {
                if (!isCurrentlyPinching) {
                    state.pinchConsecutiveCount = (state.pinchConsecutiveCount || 0) + 1;
                }
                if (isCurrentlyPinching || state.pinchConsecutiveCount >= CONFIG.pinchConsecutiveFrames) {
                    // Decide left vs right by which distance is smaller: right if distThumbMiddle < distThumbIndex, otherwise left
                    if (distThumbMiddle < distThumbIndex) {
                        return {
                            type: 'click',
                            button: 'right',
                            direction: null,
                            label: 'Gesture: Right Pinch',
                            key: 'click_right',
                            distThumbMiddle,
                            dynamicPinchThreshold: currentThreshold
                        };
                    } else {
                        return {
                            type: 'click',
                            button: 'left',
                            direction: null,
                            label: 'Gesture: Left Pinch',
                            key: 'click_left',
                            distThumbIndex,
                            dynamicPinchThreshold: currentThreshold
                        };
                    }
                }
            } else {
                state.pinchConsecutiveCount = 0;
            }

            // 2. Fist Gesture (Drag) - Only reached if neither pinch is active
            if (isAllFingersCurled) {
                const now = performance.now();
                if (!state.fistStartTime) {
                    state.fistStartTime = now;
                }
                if (now - state.fistStartTime >= CONFIG.fistHoldMs) {
                    return {
                        type: 'drag',
                        button: null,
                        direction: null,
                        label: 'Gesture: Dragging (Fist)',
                        key: 'drag',
                        isFist: true
                    };
                }
                // Before 150ms, keep the previous gesture
                const prev = state.activeGesture || {
                    type: 'move',
                    button: null,
                    direction: null,
                    label: 'Gesture: Moving',
                    key: 'move'
                };
                return {
                    ...prev,
                    isFist: true
                };
            } else {
                state.fistStartTime = 0;
            }

            // 3. Two-Finger Scroll (Index + Middle extended, Ring + Pinky folded)
            if (isIndexExtended && isMiddleExtended && !isRingExtended && !isPinkyExtended) {
                const midpointY = (indexTip.y + middleTip.y) / 2;

                if (state.prevScrollMidpointY === null) {
                    state.prevScrollMidpointY = midpointY;
                }

                const deltaY = midpointY - state.prevScrollMidpointY;

                if (deltaY < -CONFIG.scrollDeltaThreshold) {
                    state.prevScrollMidpointY -= CONFIG.scrollDeltaThreshold;
                    return {
                        type: 'scroll',
                        button: null,
                        direction: 'up',
                        deltaY: deltaY,
                        label: 'Gesture: Scroll Up',
                        key: 'scroll_up'
                    };
                } else if (deltaY > CONFIG.scrollDeltaThreshold) {
                    state.prevScrollMidpointY += CONFIG.scrollDeltaThreshold;
                    return {
                        type: 'scroll',
                        button: null,
                        direction: 'down',
                        deltaY: deltaY,
                        label: 'Gesture: Scroll Down',
                        key: 'scroll_down'
                    };
                }

                return {
                    type: 'scroll',
                    button: null,
                    direction: null,
                    deltaY: 0,
                    label: 'Gesture: Scrolling (Ready)',
                    key: 'scroll_idle'
                };
            } else {
                state.prevScrollMidpointY = null;
            }

            // 4. Default Cursor Move
            return {
                type: 'move',
                button: null,
                direction: null,
                label: 'Gesture: Moving',
                key: 'move'
            };
        }

        // --------------------------------------------------------------------------
        // 6. SYNTHETIC DOM INTERACTION & DISCRETE CLICK STATE MACHINE
        // --------------------------------------------------------------------------
        let lastPinchReleaseTime = 0;

        function triggerNativeClickAt(x, y, button = 'left') {
            let elem = document.elementFromPoint(x, y);
            if (!elem) return;

            // Target the clickable button container if text/icon was hit
            const targetBtn = elem.closest('button, a, input, select, textarea') || elem;

            // Spawn visual ripple at click coordinates
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple' + (button === 'right' ? ' right' : '');
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 400);

            if (button === 'left') {
                sfx.playClick(800);
                const mouseParams = { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window, button: 0 };
                targetBtn.dispatchEvent(new MouseEvent('mousedown', mouseParams));
                targetBtn.dispatchEvent(new MouseEvent('mouseup', mouseParams));
                targetBtn.dispatchEvent(new MouseEvent('click', mouseParams));
                if (typeof targetBtn.focus === 'function') targetBtn.focus();
            } else if (button === 'right') {
                sfx.playClick(1100);
                const mouseParams = { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window, button: 2, buttons: 2 };
                targetBtn.dispatchEvent(new MouseEvent('mousedown', mouseParams));
                targetBtn.dispatchEvent(new MouseEvent('mouseup', mouseParams));
                targetBtn.dispatchEvent(new MouseEvent('contextmenu', mouseParams));
            }
        }

        function handleScrollAction(direction) {
            if (!direction) return;
            const amount = direction === 'up' ? -CONFIG.scrollSpeedMultiplier : CONFIG.scrollSpeedMultiplier;
            window.scrollBy({ top: amount, behavior: 'auto' });
        }

        /**
         * State Machine to handle discrete clicks, hold-to-drag, and pointer events
         */
        function processGestureEvents(gesture, coords, now) {
            const isFist = gesture.type === 'drag' || gesture.isFist;

            // A. Left Pinch Handling
            if (gesture.type === 'click' && gesture.button === 'left' && !isFist) {
                // Ignore accidental left pinch trigger if right pinch was just released
                if (now - lastPinchReleaseTime > 200 && !state.isPinchingLeft && !state.isPinchingRight) {
                    state.isPinchingLeft = true;
                    state.pinchStartTime = now;
                    state.pinchAnchorCoords = { x: coords.x, y: coords.y };
                }
            } else {
                if (state.isPinchingLeft) {
                    const duration = now - state.pinchStartTime;
                    if (duration < CONFIG.clickHoldThresholdMs && !isFist) {
                        triggerNativeClickAt(state.pinchAnchorCoords.x, state.pinchAnchorCoords.y, 'left');
                        lastPinchReleaseTime = now;
                    }
                    state.isPinchingLeft = false;
                }
            }

            // B. Right Pinch Handling
            if (gesture.type === 'click' && gesture.button === 'right' && !isFist) {
                if (now - lastPinchReleaseTime > 200 && !state.isPinchingRight && !state.isPinchingLeft) {
                    state.isPinchingRight = true;
                    state.pinchStartTime = now;
                    state.pinchAnchorCoords = { x: coords.x, y: coords.y };
                }
            } else {
                if (state.isPinchingRight) {
                    const duration = now - state.pinchStartTime;
                    if (duration < CONFIG.clickHoldThresholdMs && !isFist) {
                        triggerNativeClickAt(state.pinchAnchorCoords.x, state.pinchAnchorCoords.y, 'right');
                        lastPinchReleaseTime = now;
                    }
                    state.isPinchingRight = false;
                }
            }

            // C. Scroll Execution
            if (gesture.type === 'scroll' && gesture.direction) {
                handleScrollAction(gesture.direction);
            }

            // Dispatch global CustomEvent for external consumers
            window.dispatchEvent(new CustomEvent('gesture', {
                detail: {
                    type: gesture.type,
                    button: gesture.button,
                    direction: gesture.direction,
                    x: coords.x,
                    y: coords.y,
                    isPinching: state.isPinchingLeft || state.isPinchingRight,
                    isDragging: gesture.type === 'drag',
                    timestamp: now
                }
            }));
        }

        // --------------------------------------------------------------------------
        // 7. CURSOR POSITION & CLASS UPDATE
        // --------------------------------------------------------------------------
        function updateCursorVisual(coords, gesture, now) {
            let activeX = coords.x;
            let activeY = coords.y;

            // Stabilize position during initial pinch tap (< CONFIG.clickHoldThresholdMs) to prevent jitter;
            // if held longer, follow hand smoothly for dragging.
            if (state.isPinchingLeft || state.isPinchingRight) {
                const pinchDuration = now - state.pinchStartTime;
                if (pinchDuration < CONFIG.clickHoldThresholdMs) {
                    activeX = state.pinchAnchorCoords.x;
                    activeY = state.pinchAnchorCoords.y;
                }
            }

            state.cursorEl.style.display = 'block';
            state.cursorEl.style.left = `${activeX}px`;
            state.cursorEl.style.top = `${activeY}px`;

            state.cursorEl.className = '';
            if (gesture.type === 'click') {
                if (gesture.button === 'left') state.cursorEl.classList.add('cursor-left-click');
                if (gesture.button === 'right') state.cursorEl.classList.add('cursor-right-click');
            } else if (gesture.type === 'drag') {
                state.cursorEl.classList.add('cursor-drag');
            } else if (gesture.type === 'scroll') {
                state.cursorEl.classList.add('cursor-scroll');
            }
        }

        // --------------------------------------------------------------------------
        // 8. CANVAS DRAWING (SKELETON, COLOR CODING & PROXIMITY HALOS)
        // --------------------------------------------------------------------------
        const HAND_CONNECTIONS = [
            [0, 1], [1, 2], [2, 3], [3, 4],
            [0, 5], [5, 6], [6, 7], [7, 8],
            [5, 9], [9, 10], [10, 11], [11, 12],
            [9, 13], [13, 14], [14, 15], [15, 16],
            [13, 17], [17, 18], [18, 19], [19, 20],
            [0, 17]
        ];

        function drawLandmarks(landmarks, ctx, canvasW, canvasH) {
            ctx.save();
            ctx.clearRect(0, 0, canvasW, canvasH);

            // Mirror canvas horizontally to align with mirrored webcam
            ctx.translate(canvasW, 0);
            ctx.scale(-1, 1);

            // 1. Draw Skeleton Connections
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
            ctx.lineCap = "round";

            for (const [startIdx, endIdx] of HAND_CONNECTIONS) {
                const p1 = landmarks[startIdx];
                const p2 = landmarks[endIdx];
                ctx.beginPath();
                ctx.moveTo(p1.x * canvasW, p1.y * canvasH);
                ctx.lineTo(p2.x * canvasW, p2.y * canvasH);
                ctx.stroke();
            }

            // 2. Draw 21 Landmark Nodes
            for (let i = 0; i < landmarks.length; i++) {
                const lm = landmarks[i];
                const px = lm.x * canvasW;
                const py = lm.y * canvasH;

                ctx.beginPath();
                let radius = 4;
                let color = "#10b981"; // Joint green

                if (i === 8) {
                    radius = 8;
                    color = "#00f0ff"; // Index Tip (Cyan)
                } else if (i === 4) {
                    radius = 7;
                    color = "#ef4444"; // Thumb Tip (Red)
                } else if (i === 12) {
                    radius = 7;
                    color = "#a855f7"; // Middle Tip (Purple)
                }

                ctx.arc(px, py, radius, 0, 2 * Math.PI);
                ctx.fillStyle = color;
                ctx.fill();
            }

            // 3. Left Pinch (Thumb + Index) Proximity Halo
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const wrist = landmarks[0];
            const middleMcp = landmarks[9];
            const handSizePx = calculateDistance(wrist, middleMcp, canvasW, canvasH);
            const dynamicPinchThreshold = Math.max(28, handSizePx * CONFIG.pinchThresholdScale);
            const haloThreshold = dynamicPinchThreshold * (85 / 32);

            const distLeftPx = calculateDistance(thumbTip, indexTip, canvasW, canvasH);
            const distRightPx = calculateDistance(thumbTip, middleTip, canvasW, canvasH);

            if (distLeftPx < haloThreshold) {
                const midX = ((thumbTip.x + indexTip.x) / 2) * canvasW;
                const midY = ((thumbTip.y + indexTip.y) / 2) * canvasH;

                ctx.beginPath();
                ctx.arc(midX, midY, Math.max(12, distLeftPx * 0.4), 0, 2 * Math.PI);
                ctx.strokeStyle = distLeftPx < dynamicPinchThreshold ? "#ef4444" : "rgba(0, 240, 255, 0.7)";
                ctx.lineWidth = 2;
                ctx.stroke();

                if (distLeftPx < dynamicPinchThreshold) {
                    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
                    ctx.fill();

                    ctx.save();
                    ctx.scale(-1, 1);
                    ctx.font = "bold 18px 'JetBrains Mono', monospace";
                    ctx.fillStyle = "#ef4444";
                    ctx.fillText("LEFT CLICK!", -midX - 50, midY - 18);
                    ctx.restore();
                }
            } 
            // 4. Right Pinch (Thumb + Middle) Proximity Halo
            else if (distRightPx < haloThreshold) {
                const midX = ((thumbTip.x + middleTip.x) / 2) * canvasW;
                const midY = ((thumbTip.y + middleTip.y) / 2) * canvasH;

                ctx.beginPath();
                ctx.arc(midX, midY, Math.max(12, distRightPx * 0.4), 0, 2 * Math.PI);
                ctx.strokeStyle = distRightPx < dynamicPinchThreshold ? "#a855f7" : "rgba(168, 85, 247, 0.7)";
                ctx.lineWidth = 2;
                ctx.stroke();

                if (distRightPx < dynamicPinchThreshold) {
                    ctx.fillStyle = "rgba(168, 85, 247, 0.85)";
                    ctx.fill();

                    ctx.save();
                    ctx.scale(-1, 1);
                    ctx.font = "bold 18px 'JetBrains Mono', monospace";
                    ctx.fillStyle = "#a855f7";
                    ctx.fillText("RIGHT CLICK!", -midX - 55, midY - 18);
                    ctx.restore();
                }
            }

            ctx.restore();
        }

        // --------------------------------------------------------------------------
        // 9. MAIN REAL-TIME DETECTION LOOP
        // --------------------------------------------------------------------------
        let lastVideoTime = -1;

        async function predictLoop() {
            const video = state.video;
            const canvas = state.canvas;
            const ctx = state.ctx;
            const now = performance.now();

            if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
                lastVideoTime = video.currentTime;

                // Detect Hand Landmarks
                const results = state.handLandmarker.detectForVideo(video, now);
                const validation = validateHandAndDistance(results);

                if (validation.isValid) {
                    state.gracePeriodFrames = 3;
                    const landmarks = validation.landmarks;
                    state.lastValidLandmarks = landmarks;
                    
                    // 1. Classify Gesture
                    const gesture = classifyGestureRaw(landmarks, canvas.width, canvas.height);
                    state.activeGesture = gesture;
                    state.lastValidGesture = gesture;

                    // 2. Stable Tracking pointer on Index Tip (or Midpoint of Thumb & Middle for Right Pinch)
                    let pointerX = landmarks[8].x;
                    let pointerY = landmarks[8].y;
                    if (gesture.type === 'click' && gesture.button === 'right') {
                        pointerX = (landmarks[4].x + landmarks[12].x) / 2;
                        pointerY = (landmarks[4].y + landmarks[12].y) / 2;
                    }
                    const rawCoords = mapLandmarkToScreen(pointerX, pointerY);
                    const smoothX = state.filterX.filter(rawCoords.x, now);
                    const smoothY = state.filterY.filter(rawCoords.y, now);
                    const smoothedCoords = { x: smoothX, y: smoothY };
                    state.smoothedCoords = smoothedCoords;
                    state.lastValidSmoothedCoords = smoothedCoords;

                    // 4. Update Status Label
                    state.statusText.textContent = gesture.label;

                    // 5. Update Cursor & Process DOM Events
                    updateCursorVisual(smoothedCoords, gesture, now);
                    processGestureEvents(gesture, smoothedCoords, now);

                    // 6. Draw Landmarks & Visual Proximity Halo
                    drawLandmarks(landmarks, ctx, canvas.width, canvas.height);

                } else if (state.gracePeriodFrames > 0 && state.lastValidLandmarks) {
                    // Grace Period: Tolerate momentary single dropped frame (hold visual state only)
                    state.gracePeriodFrames--;
                    const smoothedCoords = state.lastValidSmoothedCoords;
                    const gesture = state.lastValidGesture || state.activeGesture;

                    updateCursorVisual(smoothedCoords, gesture, now);
                    drawLandmarks(state.lastValidLandmarks, ctx, canvas.width, canvas.height);

                } else {
                    // Hand lost
                    if (validation.isWarn && validation.landmarks) {
                        drawLandmarks(validation.landmarks, ctx, canvas.width, canvas.height);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }

                    state.cursorEl.style.display = "none";
                    state.statusText.textContent = validation.label;

                    state.filterX.reset();
                    state.filterY.reset();
                    state.isPinchingLeft = false;
                    state.isPinchingRight = false;
                    state.prevScrollMidpointY = null;
                    state.lastValidLandmarks = null;
                    state.fistStartTime = 0;
                    state.pinchConsecutiveCount = 0;
                }
            }

            window.requestAnimationFrame(predictLoop);
        }

        // --------------------------------------------------------------------------
        // 10. SETUP INTERACTIVE TEST BUTTONS
        // --------------------------------------------------------------------------
        let count = 0;
        const btnCounter = document.getElementById("btn-counter");
        btnCounter.addEventListener("click", () => {
            count++;
            btnCounter.textContent = `Left Click Target: ${count}`;
        });

        let toggled = false;
        const btnToggle = document.getElementById("btn-toggle");
        btnToggle.addEventListener("click", () => {
            toggled = !toggled;
            btnToggle.textContent = `Toggle State: ${toggled ? "ON 🟢" : "OFF ⚪"}`;
            btnToggle.style.borderColor = toggled ? "var(--green)" : "rgba(255, 255, 255, 0.15)";
            btnToggle.style.background = toggled ? "rgba(16, 185, 129, 0.2)" : "rgba(255, 255, 255, 0.05)";
        });

        let rightCount = 0;
        const btnRight = document.getElementById("btn-right");
        function onRightClickTriggered(e) {
            if (e) e.preventDefault();
            rightCount++;
            btnRight.textContent = `Right Click Target: ${rightCount} 🟣`;
            btnRight.style.borderColor = "var(--purple)";
            btnRight.style.boxShadow = "0 0 20px rgba(168, 85, 247, 0.6)";
            setTimeout(() => {
                btnRight.style.boxShadow = "0 0 10px rgba(168, 85, 247, 0.3)";
            }, 300);
        }
        btnRight.addEventListener("contextmenu", onRightClickTriggered);
        btnRight.addEventListener("auxclick", (e) => {
            if (e.button === 2) onRightClickTriggered(e);
        });

        // Unlock Web Audio on first user interaction
        window.addEventListener('click', () => sfx.init(), { once: true });
        window.addEventListener('touchstart', () => sfx.init(), { once: true });
        window.addEventListener('keydown', () => sfx.init(), { once: true });

        // Initialize Pipeline
        initMediaPipe();

    </script>
</body>
